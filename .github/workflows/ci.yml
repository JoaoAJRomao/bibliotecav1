name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  lint-and-unit-tests:
    name: Lint & Unit/Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: librarie_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Run Database Migrations
        run: npx drizzle-kit push
        env:
          DATABASE_URL: postgresql://admin:admin@localhost:5432/librarie_db

      - name: Run Vitest Tests
        run: npm run test
        env:
          DATABASE_URL: postgresql://admin:admin@localhost:5432/librarie_db
          JWT_SECRET: test_jwt_secret_key_for_ci_runs_12345

  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: lint-and-unit-tests
    # Only run E2E on PRs (to main or dev) or direct pushes to main to reduce GitHub resource consumption.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: librarie_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Cache Next.js Build
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Build Next.js Application
        run: npm run build
        env:
          DATABASE_URL: postgresql://admin:admin@localhost:5432/librarie_db
          JWT_SECRET: test_jwt_secret_key_for_ci_runs_12345

      - name: Cache Playwright Browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright System Dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright Chromium (if not cached)
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run Database Migrations
        run: npx drizzle-kit push
        env:
          DATABASE_URL: postgresql://admin:admin@localhost:5432/librarie_db

      - name: Seed Database
        run: npx tsx src/db/seed.ts
        env:
          DATABASE_URL: postgresql://admin:admin@localhost:5432/librarie_db

      - name: Run Playwright Tests
        run: npx playwright test
        env:
          DATABASE_URL: postgresql://admin:admin@localhost:5432/librarie_db
          JWT_SECRET: test_jwt_secret_key_for_ci_runs_12345
          BASE_URL: http://localhost:3000

      - name: Upload Test Results (Traces/Screenshots)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
